[build]
  command = "npm run build"
  publish = "dist"

# Vite content-hashes every file under /assets (the filename changes
# whenever the content does), so these can be cached by the browser
# indefinitely — a rebuild always produces a new URL, never a stale one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
