<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="EarthMend — a plantable kraft-paper pen with a biodegradable seed capsule. Write, plant, grow. Sustainable corporate gifting for Australian businesses."
    />
    <title>EarthMend — A Pen That Gives Back</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EarthMend",
        "url": "https://earthmend.com.au",
        "logo": "https://earthmend.com.au/favicon.png",
        "description": "A plantable kraft-paper pen with a biodegradable seed capsule, made in Australia for sustainable corporate gifting.",
        "email": "hello@earthmend.com.au",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "179 Alfred Street",
          "addressLocality": "Fortitude Valley",
          "addressRegion": "QLD",
          "postalCode": "4006",
          "addressCountry": "AU"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms only detects <form> tags present in the built static
      HTML — it never runs the React app, so a form that only exists in
      JS-rendered DOM is invisible to it. This hidden, unreachable form
      exists purely so Netlify's build-time scanner registers the form
      name and every field (including the file upload) ahead of time.
      The real form users fill in lives in src/pages/RequestQuote.tsx and
      submits to this same form name via fetch.
    -->
    <form name="quote-request" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="address"></textarea>
      <textarea name="message"></textarea>
      <input type="file" name="brand-image" />
      <input type="text" name="quantity" />
      <input type="text" name="unit-price" />
      <input type="text" name="seeds" />
      <input type="text" name="packaging" />
      <input type="text" name="estimated-total" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
