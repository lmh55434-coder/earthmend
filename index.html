<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="EarthMend — a plantable kraft-paper pen with a biodegradable seed capsule. Write, plant, grow. Sustainable corporate gifting for Australian businesses."
    />
    <title>EarthMend — A Pen That Gives Back</title>
    <link id="page-canonical-link" rel="canonical" href="https://earthmend.com.au" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EarthMend",
        "url": "https://earthmend.com.au",
        "logo": "https://earthmend.com.au/favicon.png",
        "description": "A plantable kraft-paper pen with a biodegradable seed capsule, made in Australia for sustainable corporate gifting.",
        "email": "hello@earthmend.com.au",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "179 Alfred Street",
          "addressLocality": "Fortitude Valley",
          "addressRegion": "QLD",
          "postalCode": "4006",
          "addressCountry": "AU"
        },
        "sameAs": [
          "https://www.linkedin.com/company/earth-mend/",
          "https://www.instagram.com/earthmendpen",
          "https://www.facebook.com/share/1GjdyAgASH/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms only detects <form> tags present in the built static
      HTML — it never runs the React app, so a form that only exists in
      JS-rendered DOM is invisible to it. This hidden, unreachable form
      exists purely so Netlify's build-time scanner registers the form
      name and every field (including the file upload) ahead of time.
      The real form users fill in lives in src/pages/RequestQuote.tsx and
      submits to this same form name via fetch.
    -->
    <form name="quote-request" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="address"></textarea>
      <textarea name="message"></textarea>
      <input type="file" name="brand-image" />
      <input type="text" name="quantity" />
      <input type="text" name="unit-price" />
      <input type="text" name="seeds" />
      <input type="text" name="packaging" />
      <input type="text" name="estimated-total" />
      <input type="text" name="bot-field" />
    </form>

    <!--
      Second hidden form, same reason as above: the Special Occasions
      enquiry form (src/components/sections/OccasionsEnquiry.tsx) has a
      different field set (occasion type, event date) from the corporate
      quote-request form, so it needs its own Netlify form registration.
    -->
    <form name="occasion-enquiry" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="occasionType">
        <option>Wedding</option>
        <option>Engagement</option>
        <option>Birthday</option>
        <option>Baby Shower</option>
        <option>Bridal Shower</option>
        <option>Graduation</option>
        <option>Anniversary</option>
        <option>Christening / Naming Ceremony</option>
        <option>Corporate Event</option>
        <option>Other</option>
      </select>
      <input type="text" name="eventDate" />
      <input type="text" name="quantity" />
      <input type="text" name="brideName" />
      <input type="text" name="groomName" />
      <input type="text" name="weddingDateConfirm" />
      <input type="text" name="namesToPrint" />
      <textarea name="penBarrelMessage"></textarea>
      <textarea name="cardMessage"></textarea>
      <input type="checkbox" name="seedPreferences" value="Flower Seeds" />
      <input type="checkbox" name="seedPreferences" value="Australian Native Wildflowers" />
      <input type="checkbox" name="seedPreferences" value="Herb Seeds" />
      <input type="checkbox" name="seedPreferences" value="Vegetable Seeds" />
      <input type="checkbox" name="seedPreferences" value="Specific Seed Variety" />
      <input type="checkbox" name="seedPreferences" value="Not Sure Yet – Recommend an Option" />
      <input type="text" name="specificSeedVariety" />
      <textarea name="designPreferences"></textarea>
      <input type="text" name="recipientName" />
      <input type="text" name="streetAddress" />
      <input type="text" name="aptUnit" />
      <input type="text" name="suburb" />
      <select name="state">
        <option>QLD</option>
        <option>NSW</option>
        <option>VIC</option>
        <option>SA</option>
        <option>WA</option>
        <option>TAS</option>
        <option>NT</option>
        <option>ACT</option>
      </select>
      <input type="text" name="postcode" />
      <input type="text" name="country" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!--
      Third hidden form, same reason as above: the Business Gifting enquiry
      form (src/components/sections/BuildYourOrder.tsx) has its own field
      set (logo upload, branding, purpose) separate from the Special
      Occasions and corporate quote-request forms.
    -->
    <form
      name="business-gift-enquiry"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <input type="text" name="companyName" />
      <input type="text" name="contactName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="url" name="website" />
      <input type="checkbox" name="purpose" value="Corporate Gifting" />
      <input type="checkbox" name="purpose" value="Conferences and Seminars" />
      <input type="checkbox" name="purpose" value="Exhibitions and Trade Shows" />
      <input type="checkbox" name="purpose" value="Marketing Campaigns" />
      <input type="checkbox" name="purpose" value="Employee Gifts" />
      <input type="checkbox" name="purpose" value="Client Appreciation Gifts" />
      <input type="checkbox" name="purpose" value="Promotional Merchandise" />
      <input type="checkbox" name="purpose" value="Educational Institutions" />
      <input type="checkbox" name="purpose" value="Other" />
      <select name="estimatedQuantity">
        <option>50–99</option>
        <option>100–249</option>
        <option>250–499</option>
        <option>500–999</option>
        <option>1,000–2,499</option>
        <option>2,500–4,999</option>
        <option>5,000+</option>
        <option>Not Sure Yet</option>
      </select>
      <input type="text" name="deliveryDate" />
      <input type="text" name="deliverySuburb" />
      <select name="deliveryState">
        <option>QLD</option>
        <option>NSW</option>
        <option>VIC</option>
        <option>SA</option>
        <option>WA</option>
        <option>TAS</option>
        <option>NT</option>
        <option>ACT</option>
      </select>
      <input type="text" name="deliveryPostcode" />
      <input type="file" name="logo" multiple />
      <select name="logoPlacement">
        <option>On the Pen Barrel</option>
        <option>On the Card Holder</option>
        <option>On Both</option>
        <option>Not Sure – Recommend a Layout</option>
      </select>
      <input type="text" name="brandColours" />
      <textarea name="brandPenMessage"></textarea>
      <textarea name="brandCardMessage"></textarea>
      <input type="checkbox" name="seedPreferences" value="Flower Seeds" />
      <input type="checkbox" name="seedPreferences" value="Australian Native Wildflowers" />
      <input type="checkbox" name="seedPreferences" value="Herb Seeds" />
      <input type="checkbox" name="seedPreferences" value="Vegetables and Fruits" />
      <input type="checkbox" name="seedPreferences" value="Specific Seed Variety" />
      <input type="checkbox" name="seedPreferences" value="Not Sure – Recommend an Option" />
      <input type="text" name="specificSeedVariety" />
      <input type="checkbox" name="packagingPreferences" value="Individual Card Packaging" />
      <input type="checkbox" name="packagingPreferences" value="Bulk Packaging" />
      <input type="checkbox" name="packagingPreferences" value="Custom Branded Packaging" />
      <input type="checkbox" name="packagingPreferences" value="Not Sure – Need Recommendations" />
      <textarea name="additionalRequirements"></textarea>
      <input type="url" name="designReferenceLink" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
